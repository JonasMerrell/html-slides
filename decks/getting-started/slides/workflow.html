<section class="slide layout-agenda" data-layout="agenda">
  <h2 data-id="title">The workflow</h2>
  <ol data-id="items">
    <li>Ask an agent to draft the deck from layouts</li>
    <li>Fix things by hand: click, drag, double-click to rewrite</li>
    <li>Pin notes on anything you want the agent to change</li>
    <li>Agent addresses the notes, checks renders, resolves them</li>
  </ol>
  <aside class="notes">Steps 2 to 4 repeat until the deck is done.</aside>
</section>
