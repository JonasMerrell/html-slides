<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Embed</title>
<style>
/* While presenting, the deck sends its theme (--fg, --accent, --s1…, --font-body…) to this page.
   These values are only fallbacks for opening the page on its own. */
:root {
  --bg: #FFFFFF; --fg: #14181F; --muted: #4A5260; --dim: #737B88; --line: #DDE1E7; --surface: #F1F3F6;
  --accent: #1F5FA8; --s1: #2A78D6; --s2: #EB6834;
  --font-body: system-ui, sans-serif; --font-mono: ui-monospace, monospace; color-scheme: light;
}
/* The page fills the figure's box on the slide, in slide pixels (the slide is 1920×1080). */
html, body { margin: 0; height: 100%; background: transparent; color: var(--fg); font: 22px/1.4 var(--font-body); overflow: hidden; }
.wrap { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; gap: 14px; }
button { font: 600 20px var(--font-body); background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 8px 18px; cursor: pointer; align-self: flex-start; }
#chart { flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 14px; padding: 18px; background: var(--surface); border-radius: 15px; }
#chart > div { flex: 1; border-radius: 6px 6px 0 0; background: var(--s1); transition: height .3s; }
</style>
</head>
<body>
<div class="wrap">
  <button id="more">Add a bar</button>
  <div id="chart"></div>
</div>
<!-- Keep libraries in this folder (e.g. lib/three.min.js) and load them by relative path: no CDNs.
     Put scripts at the end of <body>, without defer/async. -->
<script src="app.js"></script>
</body>
</html>
